[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "piprints"
version = "0.1.0"
description = "A modular Raspberry Pi photo booth platform."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

authors = [
    { name = "Rylan Kinzle" }
]

dependencies = [
    "Pillow>=10.0",
    "PySide6>=6.7",
    "pyserial>=3.5",
]

[project.scripts]
piprints = "piprints.app:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"piprints.ui" = ["assets/logos/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]
